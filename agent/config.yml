  light: light-ocean
setupVersion: 2
colorBlindMode: false
defaultThinkingLevel: auto
dev:
  autoqaConsent: denied
composer:
  shape: band
hideThinkingBlock: false
github:
  enabled: true
astGrep:
  enabled: true
task:
  eager: preferred
  maxRuntimeMs: 0
  disabledAgents:
    - task
    - scout
    - sonic
    - reviewer
    - security-reviewer
  agentModelOverrides:
    bounded: openai-codex/gpt-5.6-luna:max
    specified: commandcode/meta/muse-spark-1.3-contributor:xhigh
    unrestricted: openai-codex/gpt-6-astra
  agentPrewalk:
    {}
  isolation:
    enabled: true
fetch:
  enabled: false
browser:
  enabled: false
statusLine:
  contextLine: annotated
  sessionAccent: true
  transparent: false
terminal:
  showProgress: false
tui:
  textSizing: true
  imeSafeCursor: true
display:
  showTokenUsage: true
  showTurnTime: true
  smoothStreaming: true
cycleOrder:
  - slow
compaction:
  methodOrder:
    - remote
    - soft
    - snapcompact
    - handoff
    - shake
codexResets:
  autoRedeem: "no"
