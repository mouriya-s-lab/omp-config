extensions:
  - ~/.claude
providers:
setupVersion: 2
dev:
  autoqaConsent: denied
github:
  enabled: true
astGrep:
  enabled: true
task:
  eager: preferred
  maxRuntimeMs: 0
  disabledAgents:
    - task
    - scout
    - sonic
    - reviewer
    - security-reviewer
  agentModelOverrides:
    discuss:divergent: commandcode/deepseek/deepseek-v4.1-flash, openai-codex/gpt-5.6-luna:max
    discuss:steady: openai-codex/gpt-5.6-luna:max
    mentor:default: openai-codex/gpt-5.6-sol, openai-codex/gpt-5.6-luna:max
    sonic: openai-codex/gpt-5.6-luna:max
    task: openai-codex/gpt-5.6-luna:max
    task:mid: openai-codex/gpt-5.6-luna:max
    task:low: opencode-go/muse-spark-1.3-contributor:xhigh, openai-codex/gpt-5.6-luna:max
    task:high: anthropic/claude-opus-4-8:high, openai-codex/gpt-5.6-luna:max
  agentPrewalk:
    {}
  isolation:
    enabled: true
  enableLsp: false
fetch:
  enabled: false
browser:
  enabled: false
cycleOrder:
  - slow
compaction:
  methodOrder:
    - remote
    - soft
    - snapcompact
    - handoff
    - shake
  thresholdTokens: 500000
codexResets:
  autoRedeem: "no"
lsp:
  enabled: false
