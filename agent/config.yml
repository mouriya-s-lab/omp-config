extensions:
  - ~/.claude
providers:
  webSearchOrder:
    - codex
    - perplexity
    - gemini
    - anthropic
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
symbolPreset: nerd
theme:
  dark: titanium
  light: light-ocean
setupVersion: 2
colorBlindMode: false
modelRoles:
  slow: openai-codex/gpt-6-astra:xhigh
  plan: openai-codex/gpt-6-astra:high
  commit: openai-codex/gpt-6-astra:low
  tiny: openai-codex/gpt-6-astra:low
  task: openai-codex/gpt-6-astra:medium
  advisor: openai-codex/gpt-6-astra:medium
  vision: openai-codex/gpt-6-astra:low
  default: openai-codex/gpt-5.6-luna:max
defaultThinkingLevel: auto
skills:
  ignoredSkills:
    - brainstorming
    - dispatching-parallel-agents
    - executing-plans
    - finishing-a-development-branch
    - receiving-code-review
    - requesting-code-review
    - subagent-driven-development
    - systematic-debugging
    - test-driven-development
    - using-git-worktrees
    - using-superpowers
    - verification-before-completion
    - writing-plans
    - writing-skills
dev:
  autoqaConsent: denied
composer:
  shape: band
hideThinkingBlock: false
github:
  enabled: true
astGrep:
  enabled: true
task:
  eager: preferred
  maxRuntimeMs: 0
  disabledAgents:
    - task
    - scout
    - sonic
    - reviewer
    - security-reviewer
  agentModelOverrides:
    discuss:divergent: commandcode/deepseek/deepseek-v4.1-flash, openai-codex/gpt-5.6-luna:max
    discuss:steady: openai-codex/gpt-5.6-luna:max
    mentor:default: openai-codex/gpt-5.6-sol, openai-codex/gpt-5.6-luna:max
    sonic: openai-codex/gpt-5.6-luna:max
    task: openai-codex/gpt-5.6-luna:max
    task:mid: openai-codex/gpt-5.6-luna:max
    task:low: opencode-go/muse-spark-1.3-contributor:xhigh, openai-codex/gpt-5.6-luna:max
    task:high: openai-codex/gpt-6-astra, openai-codex/gpt-5.6-luna:max
  agentPrewalk:
    {}
  isolation:
    enabled: true
  enableLsp: false
fetch:
  enabled: false
browser:
  enabled: false
statusLine:
  contextLine: annotated
  sessionAccent: true
  transparent: false
terminal:
  showProgress: false
tui:
  textSizing: true
  imeSafeCursor: true
display:
  showTokenUsage: true
  showTurnTime: true
  smoothStreaming: true
cycleOrder:
  - slow
compaction:
  methodOrder:
    - remote
    - soft
    - snapcompact
    - handoff
    - shake
  thresholdTokens: 500000
codexResets:
  autoRedeem: "no"
lsp:
  enabled: false