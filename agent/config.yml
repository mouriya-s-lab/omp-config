extensions:
  - ~/.claude
setupVersion: 2
dev:
  autoqaConsent: denied
composer:
  shape: band
github:
  enabled: true
astGrep:
  enabled: true
task:
  eager: preferred
  maxRuntimeMs: 0
  disabledAgents:
    - task
    - scout
    - sonic
    - reviewer
    - security-reviewer
  agentModelOverrides:
    discuss:divergent: "commandcode/deepseek/deepseek-v4.1-flash, openai-codex/gpt-6-luna:max"
    discuss:steady: openai-codex/gpt-6-luna:max
    mentor:default: "openai-codex/gpt-5.6-sol:high, openai-codex/gpt-6-luna:max"
    task:high: anthropic/claude-opus-5-5:high
    task:mid: openai-codex/gpt-6-sol:high
    task:free: "bansos/muse-spark-1.3-contributor:xhigh, opencode-go/muse-spark-1.3-contributor:xhigh, openai-codex/gpt-6-luna:max"
    task:low: openai-codex/gpt-6-luna:max
    sonic: openai-codex/gpt-6-luna:max
    task: openai-codex/gpt-6-luna:max
  agentPrewalk:
    {}
  isolation:
    enabled: true
  enableLsp: false
  enableEffort: false
fetch:
  enabled: true
browser:
  enabled: false
  headless: false
  cmux: false
cycleOrder:
  - slow
compaction:
  methodOrder:
    - remote
    - soft
    - snapcompact
    - handoff
    - shake
  thresholdTokens: 500000
codexResets:
  autoRedeem: "no"
lsp:
  enabled: false
retry:
  fallbackChains:
    web:
      - web/perplexity
      - google/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - xai/grok-4.5
      - web/zai
      - web/exa
      - web/tinyfish
      - web/jina
      - web/kagi
      - web/tavily
      - web/firecrawl
      - web/brave
      - web/kimi
      - web/parallel
      - web/synthetic
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
      - google-antigravity/gemini-2.5-flash
      - openai-codex/gpt-5.6
      - openai-codex/gpt-5.5
      - xai-oauth/grok-4.5
      - web/ollama
inlineToolDescriptors: "on"
tools:
  xdevDocs: inline
checkpoint:
  enabled: true
eval:
  tools:
    enabled: false
edit:
  mode: hashline
readLineNumbers: true